name: release

on:
  push:
    tags: ['v*']
  # A dry run builds and runs both checks without publishing, so the workflow
  # can be tried before the first real tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Build and check only, do not create the Release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check VITA_VERSION
        run: .github/scripts/check-version.sh "$TAG"

      - name: Extract release notes
        run: .github/scripts/changelog-section.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"

      # The Release asset must come from the tagged commit, so a real run
      # started by hand has to be started on the tag itself.
      - name: Check the ref is the tag
        if: env.DRY_RUN != 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "release.yml: publishing $TAG needs a run on refs/tags/$TAG, not $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ElevenMPV.vpk
          path: ${{ runner.temp }}/vpk

      - name: Name the asset
        run: mv "$RUNNER_TEMP/vpk/ElevenMPV.vpk" "$RUNNER_TEMP/Material-Eleven-${TAG#v}.vpk"

      - name: Create the Release
        if: env.DRY_RUN != 'true'
        run: >
          gh release create "$TAG" "$RUNNER_TEMP/Material-Eleven-${TAG#v}.vpk"
          --verify-tag
          --title "Material-Eleven ${TAG#v}"
          --notes-file "$RUNNER_TEMP/notes.md"

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "Dry run for $TAG: no Release created."
            echo
            echo "Asset: Material-Eleven-${TAG#v}.vpk"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
